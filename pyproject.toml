[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domino"
version = "0.1.0"
description = "Domino - SYNTHETIC DEMO of cross-border kidney-exchange discovery over Flower. NOT A CLINICAL MATCHING TOOL."
license = "Apache-2.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr==1.39.0",
    "pydantic>=2.6,<3",
    "networkx>=3.2",
    "cryptography>=41",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["domino"]

# --- Flower app (flwr 1.39.0, ServerApp/ClientApp; see README for the AgentApp decision)
[tool.flwr.app]
publisher = "domino"

[tool.flwr.app.components]
serverapp = "domino.coordinator.server_app:app"
clientapp = "domino.hospital.client_app:app"

[tool.flwr.app.config]
# Absolute path of the coordinator state dir on the machine that runs the ServerApp.
# Overridden by start-coordinator.sh: flwr run -c 'state-dir="..."'
state-dir = "./state/coordinator"
# Seconds between readiness polls while a plan is active
poll-seconds = 5
# Seconds to wait for hospital replies in one Flower round
round-timeout = 60
# Number of SuperNodes expected (3 hospitals)
num-hospitals = 3
